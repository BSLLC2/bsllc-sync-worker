name: Debug — Integrus revenue schedule (read-only)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Debug
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run debug-integrus-revenue-schedule
