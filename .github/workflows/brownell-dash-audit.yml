name: Brownell dashboard audit (GA4 + Search Console, READ ONLY)

# Read-only pull of one client's GA4 and Search Console data to answer a
# dashboard reconciliation. Writes nothing to any database or Google property.
on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client name prefix"
        required: true
        default: "Brownell"
      property:
        description: "GA4 property id override (optional)"
        required: false
        default: ""
      start:
        description: "YTD start"
        required: false
        default: "2026-01-01"
      end:
        description: "YTD end"
        required: false
        default: "2026-10-22"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Pull
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run brownell-dash-audit -- --client="${{ inputs.client }}" --property="${{ inputs.property }}" --start="${{ inputs.start }}" --end="${{ inputs.end }}" 2>&1 | tee brownell-dash-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brownell-dash-audit
          path: |
            brownell-dash-audit.txt
            brownell-dash-audit.json
