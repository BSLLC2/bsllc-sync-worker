name: Verify Brand Awareness live status (READ ONLY)

# Direct re-verification of Brand Awareness campaign status/ads plus a
# re-check of the other headline claims made in the OHC Ads follow-up.
# Queries only; performs no mutates.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run diagnostic
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_DIR: ${{ github.workspace }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID || '2141712409' }}
        run: npm run verify-brand-awareness-live 2>&1 | tee diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-brand-awareness
          path: diagnostic.txt
