name: Import offline conversions (close-the-loop)

# Matches real admissions to the ad clicks (gclids) that produced them and
# uploads them to Google Ads as offline conversions, so bidding optimizes toward
# patients, not form fills. Sends through the Data Manager API (Google closed the
# old upload method). Validate-only until a person sets api_mode=send or the repo
# variable OCH_DM_MODE=send. Never creates a conversion action. Idempotent (dedupe
# table); discovers the OCH Ads account and exits cleanly when no gclids have been captured yet.
on:
  schedule:
    - cron: "20 8 * * *" # 08:20 UTC daily, after admissions + web-inquiry imports
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Match + print only, upload nothing (true/false)."
        required: false
        default: "false"
      csv:
        description: "Write the Google Ads upload file instead of calling the API (true/false). Nothing is sent. Download it from the run's artifacts."
        required: false
        default: "false"
      api_mode:
        description: "validate (default: Google checks the request, nothing is sent) or send. Send needs a validate pass in the last 14 days."
        required: false
        default: "validate"
      mark_uploaded:
        description: "With csv: record the rows as uploaded by hand so the daily run skips them (true/false). Only after the file was uploaded in Google Ads."
        required: false
        default: "false"

concurrency:
  group: offline-conversions
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Upload offline conversions
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: "2141712409"
          OCH_ADS_CUSTOMER_ID: ${{ secrets.OCH_ADS_CUSTOMER_ID }}
          DATA_MANAGER_REFRESH_TOKEN: ${{ secrets.DATA_MANAGER_REFRESH_TOKEN }}
          DM_MODE: ${{ inputs.api_mode || vars.OCH_DM_MODE || (github.event_name == 'schedule' && 'send') || 'validate' }}
          OCH_SHEET_ID: ${{ vars.OCH_SHEET_ID }}
          OCH_ADMISSIONS_TAB: ${{ vars.OCH_ADMISSIONS_TAB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if [ "${{ inputs.csv }}" = "true" ]; then
            EXTRA=""
            if [ "${{ inputs.mark_uploaded }}" = "true" ]; then EXTRA="--mark-uploaded"; fi
            npm run import-offline-conversions -- --csv=och-upload.csv $EXTRA 2>&1 | tee run.log
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run import-offline-conversions -- --dry-run 2>&1 | tee run.log
          else
            case "$DM_MODE" in send|validate) ;; *) DM_MODE=validate ;; esac
            npm run import-offline-conversions -- --api=$DM_MODE 2>&1 | tee run.log
          fi

      - name: Keep the upload file (private artifact, click ids only)
        if: ${{ inputs.csv == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: och-upload-file
          path: och-upload.csv
          retention-days: 7
          if-no-files-found: ignore

      - name: Heartbeat
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # --log: on failure the note is the script's last error line, so the
        # Data health page says why instead of the bare "job status: failure".
        run: npm run heartbeat -- --job=offline_conversions --status=${{ job.status }} --log=run.log
