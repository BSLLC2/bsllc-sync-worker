name: Diag OCH metrics

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx src/diag-och.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
