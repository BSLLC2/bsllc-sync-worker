name: Seed / refresh the Data readiness project (OS backlog)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = print only"
        required: false
        default: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run seed-data-readiness-project -- --dry-run="${{ inputs.dry_run }}"
