name: Import WebOps site health (WP Umbrella)

# Daily WP Umbrella pull for WebOps add-on clients. Writes site_health_snapshots
# (uptime / security / updates / backups) so the dashboard's site_health score
# and the maintenance report card have real data. No dashboard checkout needed —
# writes the snapshot table directly.
#
# Needs repo secrets: WP_UMBRELLA_API_KEY, DATABASE_URL.
on:
  schedule:
    - cron: "20 8 * * *" # 08:20 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pull + print only, write nothing (true/false)."
        required: false
        default: "false"

concurrency:
  group: webops-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run WebOps import
        env:
          # Accept either secret name (WP_UMBRELLA_API_KEY or WPUMBRELLA_API_KEY).
          WP_UMBRELLA_API_KEY: ${{ secrets.WP_UMBRELLA_API_KEY || secrets.WPUMBRELLA_API_KEY }}
          WP_UMBRELLA_BASE: ${{ secrets.WP_UMBRELLA_BASE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run import-webops -- --dry-run
          else
            npm run import-webops
          fi
      - name: Heartbeat
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run heartbeat -- --job=webops_import --status=${{ job.status }}
