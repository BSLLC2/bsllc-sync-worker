name: Import AEO / AI visibility (DataForSEO)

# Weekly answer-engine visibility tracking. For each client's tracked prompts
# (aeo_prompts), asks each AI engine (ChatGPT / Gemini / Perplexity by default)
# via DataForSEO's AI Optimization API and records whether the brand is
# mentioned / its domain cited. Writes aggregate metrics via `npm run sync`
# (source 'aeo'). Cost scales with prompts x providers, so it runs weekly.
#
# Needs repo secrets: DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD, DATABASE_URL,
# DASHBOARD_REPO_TOKEN. Optional: AEO_PROVIDERS (comma list, default
# chatgpt,gemini,perplexity).
on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, after the SEO import
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pull + print only, write nothing (true/false)."
        required: false
        default: "false"
      client:
        description: "Limit to one client slug (optional)."
        required: false
        default: ""

concurrency:
  group: aeo-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the worker
        uses: actions/checkout@v4
        with:
          path: worker

      - name: Check out the dashboard (for `npm run sync`)
        uses: actions/checkout@v4
        with:
          repository: BSLLC2/bsllc-account-health
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run AEO import
        working-directory: worker
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          AEO_PROVIDERS: ${{ secrets.AEO_PROVIDERS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_DIR: ${{ github.workspace }}/dashboard
        run: |
          ARGS=""
          [ -n "${{ inputs.client }}" ] && ARGS="$ARGS --client=${{ inputs.client }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run import-aeo -- --dry-run $ARGS
          else
            npm run import-aeo -- $ARGS
          fi

      - name: Heartbeat
        if: always()
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run heartbeat -- --job=aeo_import --status=${{ job.status }}
