name: Check recent meetings (diagnostic)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check recent client_meetings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run check-recent-meetings
