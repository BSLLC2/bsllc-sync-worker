name: CI

# Every push and every pull request. Nothing here touches a credential, a
# client account or the database — it typechecks the worker and runs the pure
# guards, so it can run on every commit without a single secret. A guard
# nothing runs is a guard nobody knows is asleep.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lead cadence guard
        run: npm run verify:lead-cadence
      - name: Ads findings guard
        run: npm run verify-ads-findings
      - name: Ads evidence-strength guard
        run: npm run verify-ads-evidence-strength
      - name: Zero-vs-nothing guard
        run: npm run verify-zero-vs-nothing
      - name: Meta importer guard
        run: npm run verify-meta-import
      - name: HubSpot deal-outcome guard
        run: npm run verify-hubspot-deal-status
      - name: Attribution-date guard
        run: npm run verify-attribution-dates
      - name: Connection probe guard
        run: npm run verify-connection-probe
      - name: Ads operability guard
        run: npm run verify-ads-operability
      - name: OCH admissions import guard
        run: npm run verify-och-import
      - name: OCH attribution guard
        run: npm run verify-och-attribution
      - name: OCH sheet connection guard
        run: npm run verify-och-sheet
      - name: OCH sheet connection, end to end against a pretend Google
        run: npm run verify-och-e2e
      - name: GA4 per-channel import guard
        run: npm run verify-ga4-channels
      - name: QuickBooks invoice reconciliation guard
        run: npm run verify-qbo-reconcile
      - name: Gmail body extraction guard
        run: npm run verify-email-body
      - name: Scoped email-body backfill guard
        run: npm run verify-email-backfill
      # The reminder that never fired. It compared the wrong timestamp and went
      # silent for twenty days on a client whose leads had stopped.
      - name: Alert reminder times the alert, not the run
        run: npm run verify-alert-reminder
