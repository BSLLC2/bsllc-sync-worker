name: Send team notifications

# Delivers internal task notifications (@mentions, AM review pings) the app
# enqueues in team_notifications, routed to each person's chosen channels
# (push / Slack DM / SMS). Runs every 3 min + on demand. No-op when empty.
on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print only (true/false)."
        required: false
        default: "false"

concurrency:
  group: send-team-notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Deliver team notifications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run send-team-notifications -- --dry-run
          else
            npm run send-team-notifications
          fi
      - name: Heartbeat
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run heartbeat -- --job=team_notify --status=${{ job.status }}
