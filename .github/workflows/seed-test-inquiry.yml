name: Seed test web inquiry

on:
  workflow_dispatch:
    inputs:
      undo:
        description: "Set to true to REMOVE the test inquiry instead of adding it."
        required: false
        default: "false"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Seed / remove test inquiry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.undo }}" = "true" ]; then
            npx tsx src/seed-test-inquiry.ts --undo
          else
            npx tsx src/seed-test-inquiry.ts
          fi
