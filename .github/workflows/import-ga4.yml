name: Import GA4 conversions

# Reads GA4 monthly conversions with the shared service account and plants
# `ga4.conversions` per client via `npm run sync`. The Marketing tab's source
# waterfall prefers GA4 conversions over Ads. Idempotent — safe to re-run.
#
# Requires the GA4_PROPERTY_MAP secret: JSON of {"client-slug":"propertyId"}.
on:
  schedule:
    - cron: "45 7 * * *" # 07:45 UTC daily, after HubSpot + OCH
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse + print only, write nothing (true/false)."
        required: false
        default: "false"
      # NOTHING IS BACKFILLED BY THE SCHEDULE. The per-channel breakdown reads
      # the last three months by default (DEFAULT_CHANNEL_MONTHS in
      # src/ga4/channel-rows.ts) -- enough for a closed month's restatement to
      # land, and not the whole of a client's history. Widening it here is how
      # a backfill is performed: one API call per property either way, N months
      # of rows, and the write is an upsert so re-running costs nothing on the
      # months that already landed. 0 turns the breakdown off entirely.
      channel_months:
        description: "Months of per-channel history to read (blank = 3; raise to backfill; 0 = off)."
        required: false
        default: ""

concurrency:
  group: ga4-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the worker
        uses: actions/checkout@v4
        with:
          path: worker

      - name: Check out the dashboard (for `npm run sync`)
        uses: actions/checkout@v4
        with:
          repository: BSLLC2/bsllc-account-health
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run GA4 import
        working-directory: worker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_MAP: ${{ secrets.GA4_PROPERTY_MAP }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_DIR: ${{ github.workspace }}/dashboard
        run: |
          CHAN=""
          if [ -n "${{ inputs.channel_months }}" ]; then
            CHAN="--channel-months=${{ inputs.channel_months }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run import-ga4 -- --dry-run $CHAN
          else
            npm run import-ga4 -- $CHAN
          fi

      - name: Heartbeat
        if: always()
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run heartbeat -- --job=import_ga4 --status=${{ job.status }}
