name: Fix OCH baseline status (one-off repair)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only"
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fix OCH baseline status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run fix-och-baseline-status -- ${{ inputs.dry_run && '--dry-run' || '' }}
