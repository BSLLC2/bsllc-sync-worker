name: One-off — fix DPG D365 billing classification

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, delete nothing (true/false)."
        required: false
        default: "true"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            npm run oneoff-fix-d365-billing-classification -- --dry-run=false
          else
            npm run oneoff-fix-d365-billing-classification -- --dry-run=true
          fi
