name: Google's ad recommendations (read-only)

# Reads Google Ads' own "recommendation" list for each mapped account and keeps
# it, so the dashboard can say which of Google's suggestions fit which client
# and which conflict with what the client agreed (an approved budget, protected
# terms, a conversion column that has stopped counting).
#
# READ-ONLY. recommendation is a SELECT. The API's apply and dismiss calls are
# not used anywhere in this repository, and the guard fails if they appear.
# Dismissing a suggestion in the dashboard is a record on our side only.
#
# DAILY. A suggestion is regenerated by Google as the account moves, so a daily
# read keeps the list near the platform's without spending quota on it. A row
# Google stops returning is closed only when the read was whole.
on:
  schedule:
    # 04:20 UTC daily: after the structure snapshot (03:40), before the morning
    # audit, and clear of the change capture on :10.
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: "Limit to one client slug. Blank = every mapped account."
        required: false
        default: ""
      dry_run:
        description: "Read and print, write nothing (true/false)."
        required: false
        default: "false"

concurrency:
  group: ads-google-recs
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Read Google's recommendations
        id: run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_DIR: ${{ github.workspace }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID || '2141712409' }}
          # Typed inputs go through the environment, never into the command line.
          INPUT_CLIENT: ${{ inputs.client }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=()
          [ -n "$INPUT_CLIENT" ] && ARGS+=("--client=$INPUT_CLIENT")
          [ "$INPUT_DRY_RUN" = "true" ] && ARGS+=("--dry-run")
          npm run ads-google-recs -- "${ARGS[@]}" 2>&1 | tee run.log

      - name: Heartbeat
        # A dry run and a single-account run are both excluded: the heartbeat is
        # ONE row for the whole book, and stamping it from a run that read one
        # account would claim every other account was read today.
        if: always() && inputs.dry_run != 'true' && inputs.client == ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run heartbeat -- --job=ads_google_recs --status=${{ job.status }} --note="${{ steps.run.outputs.summary }}" --log=run.log
