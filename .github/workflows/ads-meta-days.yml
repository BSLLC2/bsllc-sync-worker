name: Meta ads in depth (read-only)

# Each Meta ad by day, each ad set by placement, age and gender, and the
# campaign / ad set / ad settings as a daily snapshot.
#
# READ-ONLY. Every request is a GET to the Graph API. Nothing is written to Meta.
#
# A DISPATCHED RUN IS A DRY ONE UNLESS YOU SAY OTHERWISE. A scheduled run is live.
on:
  schedule:
    # 06:25 UTC daily: after the account day has closed in every US zone, clear of
    # the Google reads (03:40 to 06:10) and the monthly Meta importer.
    - cron: "25 6 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: "Limit to one client slug. Blank = every mapped Meta account."
        required: false
        default: ""
      days:
        description: "Days to read. Blank = 60 on a first run, 14 after."
        required: false
        default: ""
      dry_run:
        description: "Read and print, write nothing (true/false). Defaults to true."
        required: false
        default: "true"

concurrency:
  group: ads-meta-days
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Read the Meta ad figures
        id: run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          # Inputs go through the environment, never into the command line.
          IN_CLIENT: ${{ inputs.client }}
          IN_DAYS: ${{ inputs.days }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          [ -n "$IN_CLIENT" ] && ARGS="--client=$IN_CLIENT"
          [ -n "$IN_DAYS" ] && ARGS="$ARGS --days=$IN_DAYS"
          [ "$IN_DRY" = "true" ] && ARGS="$ARGS --dry-run"
          set -o pipefail
          npm run ads-meta-days -- $ARGS 2>&1 | tee run.log

      # `if: always()` so a FAILED run is recorded as a failure rather than as
      # silence. A dry run and a single-account run are excluded: the heartbeat
      # is one row for the whole book.
      - name: Heartbeat
        if: always() && inputs.dry_run != 'true' && inputs.client == ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # The note is the job's own counts, never text from an ad account.
        run: npm run heartbeat -- --job=ads_meta_days --status=${{ job.status }} --note="${{ steps.run.outputs.summary }}" --log=run.log
