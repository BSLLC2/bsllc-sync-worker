name: One-off — delete future-dated metric_snapshots rows (per source)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "metric_snapshots source to clean (ga4, hubspot, gsc, d365 …)"
        required: false
        default: "hubspot"
      dry_run:
        description: "Parse + print only, write nothing (true/false)."
        required: false
        default: "true"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fix
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run oneoff-delete-future-ga4-snapshots -- --source="${{ inputs.source }}" --dry-run
          else
            npm run oneoff-delete-future-ga4-snapshots -- --source="${{ inputs.source }}"
          fi
