name: Diag client-detail schema

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check columns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/diag-detail.ts
