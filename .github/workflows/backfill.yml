name: Backfill history (manual)

# One-time (or occasional) historical backfill. Plants ~52 weekly backdated
# snapshots so the dashboard's week/month/quarter trends populate. Run by hand
# from the Actions tab — it is never scheduled.
on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "How many weekly history points to plant"
        required: true
        default: "52"
      dry_run:
        description: "Validate only, write nothing"
        type: boolean
        required: true
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the worker
        uses: actions/checkout@v4
        with:
          path: worker

      - name: Check out the dashboard (for `npm run sync`)
        uses: actions/checkout@v4
        with:
          repository: BSLLC2/bsllc-account-health
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run backfill
        working-directory: worker
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: "2141712409"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_DIR: ${{ github.workspace }}/dashboard
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run backfill -- --weeks=${{ inputs.weeks }} --dry-run
          else
            npm run backfill -- --weeks=${{ inputs.weeks }}
          fi

      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL secret set — skipping Slack alert."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: *Backfill failed* — <$RUN_URL|run #${{ github.run_number }}> on \`${{ github.repository }}\`\"}" \
            "$SLACK_WEBHOOK_URL"
