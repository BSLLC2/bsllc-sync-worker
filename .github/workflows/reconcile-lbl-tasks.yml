name: Reconcile LBL tasks (Master Priority Aug 2026)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan only, write nothing (true/false)."
        required: false
        default: "true"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Reconcile
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            npm run reconcile-lbl-tasks
          else
            npm run reconcile-lbl-tasks -- --dry-run
          fi
