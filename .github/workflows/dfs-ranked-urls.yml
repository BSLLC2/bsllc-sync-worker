name: DataForSEO ranked keywords by URL (READ ONLY)

# Labs ranked_keywords for a comma-separated list of page URLs. No writes.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Comma-separated absolute URLs"
        required: true
      limit:
        description: "Rows per URL (by search volume desc)"
        required: false
        default: "30"

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Pull ranked keywords
        env:
          URLS: ${{ inputs.urls }}
          LIMIT: ${{ inputs.limit }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: npm run dfs-ranked-urls 2>&1 | tee dfs-ranked-urls.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dfs-ranked-urls
          path: dfs-ranked-urls.txt
