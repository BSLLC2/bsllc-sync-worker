name: Debug — Studio B1 GA4 config status

on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run debug-studio-b1-ga4
