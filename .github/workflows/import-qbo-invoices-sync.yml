name: QBO — customer/invoice/recurring-invoice sync

# Pulls QBO's real Customer, Invoice, and RecurringTransaction (invoice-type)
# lists into Postgres so the dashboard's "Closed won -- not yet billed"
# worklist can check real QBO billing evidence instead of only the Quote
# Designer push-side marker. Same QBO connection already used elsewhere; no
# new secrets, no new OAuth consent.
#
# It also RECONCILES: after a read it can prove was complete, any open invoice
# row QuickBooks no longer returns is zeroed, with the reason and the balance
# it last carried kept on the row. Nothing is ever deleted, and a read that
# cannot prove its own completeness changes nothing and says so on the
# heartbeat note. See src/qbo/invoice-reconcile.ts. Still read-only against
# QuickBooks -- the reconciliation writes to Postgres only.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print only, write nothing to Postgres (true/false)."
        required: false
        default: "false"

concurrency:
  group: import-qbo-invoices-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Sync QBO customers/invoices/recurring invoices
        id: sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REALM_ID: ${{ secrets.QBO_REALM_ID }}
          QBO_REFRESH_TOKEN: ${{ secrets.QBO_REFRESH_TOKEN }}
          QBO_ENV: ${{ secrets.QBO_ENV }}
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run import-qbo-invoices-sync -- --dry-run 2>&1 | tee run.log
          else
            npm run import-qbo-invoices-sync 2>&1 | tee run.log
          fi
      - name: Heartbeat
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # --note carries the reconciliation's own one-line outcome (the script
        # writes summary= to $GITHUB_OUTPUT). Without it, a run that quietly
        # stopped closing rows -- because the read came back short, or the
        # count could not be asked for -- reads on Admin -> Data health exactly
        # like a clean week. --log is what makes a FAILED run say why; on
        # failure the log's last line beats the note (see src/heartbeat.ts).
        run: |
          npm run heartbeat -- --job=qbo_invoices_sync --status=${{ job.status }} \
            --note="${{ steps.sync.outputs.summary }}" --log=run.log
