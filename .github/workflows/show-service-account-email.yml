name: Show service account email (read-only)

# Prints ONLY the shared Google service account's client_email — never the
# private key — so it can be added as a user in Search Console, GA4, Google
# Ads, or shared on a Google Sheet. The email itself isn't sensitive.
on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Show
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run show-service-account-email
