name: Integrus strategy check 2 (READ ONLY)

# Follow-up read-only checks: what each host serves, brand SERPs, intent SERPs.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run keyword audit
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: npm run integrus-strategy-check-2 2>&1 | tee integrus-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrus-check
          path: integrus-check.txt
