name: Incremental sync (daily)

# Runs the trailing-30-day Google Ads pull every morning and feeds it to the
# dashboard via `npm run sync`. No server needed — GitHub runs this on schedule.
on:
  # Google Ads Basic access is approved, so the daily pull is live again.
  # (Was paused under Explorer's tiny quota, which 429'd and stamped
  # "Update failed".)
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # still runnable by hand from the Actions tab

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the worker
        uses: actions/checkout@v4
        with:
          path: worker

      - name: Check out the dashboard (for `npm run sync`)
        uses: actions/checkout@v4
        with:
          repository: BSLLC2/bsllc-account-health
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run incremental sync
        working-directory: worker
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          # MCC id (BS LLC · Manager) — not secret, so it lives here in the open.
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: "2141712409"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_DIR: ${{ github.workspace }}/dashboard
        run: npm run incremental

      # Slack error alert (Definition of Done). No-ops safely until you add the
      # SLACK_WEBHOOK_URL secret, so the workflow runs green before Slack is wired.
      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL secret set — skipping Slack alert."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: *Incremental sync failed* — <$RUN_URL|run #${{ github.run_number }}> on \`${{ github.repository }}\`\"}" \
            "$SLACK_WEBHOOK_URL"
