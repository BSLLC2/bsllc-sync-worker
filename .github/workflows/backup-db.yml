name: Nightly DB backup

# Belt-and-suspenders on top of Neon's point-in-time recovery: a nightly
# pg_dump of the whole database. When BACKUP_PASSPHRASE is set the dump is
# GPG-encrypted (AES-256) before it leaves the runner, integrity-checked, kept
# as a 90-day GitHub artifact, and (if BACKUP_DRIVE_FOLDER_ID is set) copied to
# an offsite Google Drive folder. This is a lot of client PII — see
# docs/BACKUP_RESTORE_RUNBOOK.md for setup + how to restore.
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC, after the daily imports
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Falls back to Ubuntu's default postgresql-client if the PGDG repo/key
      # dance fails (a third-party apt repo on a version-pinned package is
      # exactly the kind of thing a runner-image bump silently breaks) — a
      # plain-format dump is broadly compatible across nearby major versions,
      # and a dump that runs beats no dump because of a strict version pin.
      - name: Install pg_dump (matches Neon's server major, falls back to distro default)
        # pg_dump refuses to dump from a server NEWER than itself ("aborting
        # because of server version mismatch") -- it's fine to trail behind
        # an older server, never ahead of a newer one. This used to hardcode
        # a specific version (postgresql-client-16, later bumped to -18 when
        # Neon moved to Postgres 18 on 2026-08-26) -- that bump ALSO silently
        # failed, because the -18 package name didn't resolve in PGDG's repo
        # for this runner's distro at the time, and the script's own
        # fallback branch swallowed the failure and quietly reinstalled
        # Ubuntu's stock v16 client instead. A hardcoded guess is exactly
        # the kind of pin that goes stale without anyone noticing, so this
        # now asks the PGDG repo what its newest available client actually
        # is and installs that -- no version number to remember to bump.
        run: |
          set -uo pipefail
          if sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list' \
            && curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg \
            && sudo apt-get update; then
            PKG=$(apt-cache search --names-only '^postgresql-client-[0-9]+$' | awk '{print $1}' | sed -E 's/postgresql-client-//' | sort -n | tail -1)
            if [ -n "$PKG" ] && sudo apt-get install -y "postgresql-client-$PKG"; then
              echo "Installed postgresql-client-$PKG from PGDG (newest available)."
            else
              echo "::warning::No installable postgresql-client-NN found in PGDG's repo — falling back to Ubuntu's default postgresql-client."
              sudo rm -f /etc/apt/sources.list.d/pgdg.list
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            fi
          else
            echo "::warning::PGDG repo/key setup failed — falling back to Ubuntu's default postgresql-client."
            sudo rm -f /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version

      - name: Dump + encrypt
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          base="bsllc-db-$ts.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=plain | gzip -9 > "$base"
          if [ -n "${BACKUP_PASSPHRASE:-}" ]; then
            enc="$base.gpg"
            gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" --cipher-algo AES256 --symmetric -o "$enc" "$base"
            # Integrity check: decrypt + verify the gzip stream, then shred the plaintext.
            gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" -d "$enc" | gunzip -t
            echo "Encrypted + integrity-verified: $enc"
            shred -u "$base" 2>/dev/null || rm -f "$base"
            echo "file=$enc" >> "$GITHUB_OUTPUT"
            echo "encrypted=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BACKUP_PASSPHRASE not set — backup is UNENCRYPTED. Add the secret to encrypt client PII at rest."
            echo "file=$base" >> "$GITHUB_OUTPUT"
            echo "encrypted=0" >> "$GITHUB_OUTPUT"
          fi
          ls -lh bsllc-db-*

      - name: Upload backup artifact (90-day)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ steps.dump.outputs.file }}
          retention-days: 90
          if-no-files-found: error

      - name: Copy to Google Drive (offsite)
        if: ${{ steps.dump.outputs.encrypted == '1' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BACKUP_DRIVE_FOLDER_ID: ${{ secrets.BACKUP_DRIVE_FOLDER_ID }}
          BACKUP_DRIVE_IMPERSONATE: ${{ secrets.BACKUP_DRIVE_IMPERSONATE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_DRIVE_FOLDER_ID:-}" ]; then
            echo "BACKUP_DRIVE_FOLDER_ID not set — skipping offsite copy (GitHub artifact still kept)."
            exit 0
          fi
          npm ci
          npm run upload-to-drive -- --file="${{ steps.dump.outputs.file }}"

      # Independent of the pg_dump/PGDG toolchain above on purpose — that step
      # (a third-party apt repo + a version-pinned package) is exactly the kind
      # of thing that silently breaks on a runner-image bump. If it takes psql
      # down with it, the OLD version of this step (a raw psql -c one-liner)
      # went down too, so a broken backup wrote nothing to job_heartbeats and
      # looked identical to "still fine" for days. `npm run heartbeat` only
      # needs Node + the `pg` package, so it writes a heartbeat regardless of
      # whether the dump itself succeeded.
      - name: Install deps for heartbeat
        if: always()
        run: npm ci

      - name: Heartbeat
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run heartbeat -- --job=db_backup --status=${{ job.status }} --note="dump=${{ steps.dump.outcome }}"
