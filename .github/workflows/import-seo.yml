name: Import SEO ranks (DataForSEO)

# Weekly keyword rank tracking. Reads each client's keyword list (seo_targets)
# + tracked domain (clients.seo_domain) from Postgres, pulls Google organic
# positions from DataForSEO's SERP API, and writes aggregate metrics via
# `npm run sync` (source 'seo'). Replaces metered SEMrush position tracking.
#
# Needs repo secrets: DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD, DATABASE_URL,
# DASHBOARD_REPO_TOKEN.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pull + print only, write nothing (true/false)."
        required: false
        default: "false"
      client:
        description: "Limit to one client slug (optional)."
        required: false
        default: ""

concurrency:
  group: seo-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the worker
        uses: actions/checkout@v4
        with:
          path: worker

      - name: Check out the dashboard (for `npm run sync`)
        uses: actions/checkout@v4
        with:
          repository: BSLLC2/bsllc-account-health
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          path: dashboard

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run SEO import
        working-directory: worker
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_DIR: ${{ github.workspace }}/dashboard
        run: |
          ARGS=""
          [ -n "${{ inputs.client }}" ] && ARGS="$ARGS --client=${{ inputs.client }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run import-seo -- --dry-run $ARGS
          else
            npm run import-seo -- $ARGS
          fi

      - name: Heartbeat
        if: always()
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run heartbeat -- --job=seo_import --status=${{ job.status }}
